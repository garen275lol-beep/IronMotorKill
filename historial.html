<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Historial del Vehículo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <img src="img/screen.png" alt="Logo del Taller" width="120" style="margin-bottom:15px;">
    <h2>Historial del Vehículo</h2>
    <p>Cédula: <span id="cedula"></span></p>
    <p>Teléfono: <span id="telefono"></span></p>
    <p>Marca: <span id="marca"></span></p>
    <p>Color: <span id="color"></span></p>
    <p>Placas: <span id="placas"></span></p>
    <p>Hora de entrada: <span id="horaEntrada"></span></p>
    <a id="linkSalida" href="#">Registrar salida</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    document.getElementById("cedula").textContent = params.get("cedula") || "No registrada";
    document.getElementById("telefono").textContent = params.get("telefono") || "No registrado";
    document.getElementById("marca").textContent = params.get("marca") || "No registrada";
    document.getElementById("color").textContent = params.get("color") || "No registrado";
    document.getElementById("placas").textContent = params.get("placas") || "No registrada";
    document.getElementById("horaEntrada").textContent = params.get("horaEntrada") || "No registrada";

    const link = document.getElementById("linkSalida");
    link.href = `salida.html?cedula=${params.get("cedula")}&telefono=${params.get("telefono")}&marca=${params.get("marca")}&color=${params.get("color")}&placas=${params.get("placas")}&horaEntrada=${params.get("horaEntrada")}`;
  </script>
</body>
</html>
