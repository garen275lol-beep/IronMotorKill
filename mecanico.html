<!DOCTYPE html>
<html lang="es">
<head>

  <title>Mecánico Asignado</title>

    const marca = params.get("marca");
    const color = params.get("color");
    const placas = params.get("placas");

    document.getElementById("placas").textContent = placas || "No registrada";

    const ahora = new Date();
    const horaEntrada = ahora.getHours().toString().padStart(2, '0') + ":" +
                        ahora.getMinutes().toString().padStart(2, '0');
    document.getElementById("horaEntrada").textContent = horaEntrada;

    const link = document.getElementById("linkProceso");
    link.href = `proceso.html?cedula=${cedula}&telefono=${telefono}&marca=${marca}&color=${color}&placas=${placas}&horaEntrada=${horaEntrada}`;
  </script>
</body>
</html>
