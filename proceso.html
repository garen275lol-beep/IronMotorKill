<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Vehículo en Reparación</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Estado del Vehículo</h2>
    <p>El vehículo está en reparación</p>
    <p>Hora de entrada: <span id="horaEntrada"></span></p>
    <p>Placas del vehículo: <span id="placas"></span></p>
    <a id="linkHistorial" href="#">Ver historial</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const cedula = params.get("cedula");
    const telefono = params.get("telefono");
    const marca = params.get("marca");
    const color = params.get("color");
    const placas = params.get("placas");
    const horaEntrada = params.get("horaEntrada");

    document.getElementById("placas").textContent = placas || "No registrada";
    document.getElementById("horaEntrada").textContent = horaEntrada || "No registrada";

    const link = document.getElementById("linkHistorial");
    link.href = `historial.html?cedula=${cedula}&telefono=${telefono}&marca=${marca}&color=${color}&placas=${placas}&horaEntrada=${horaEntrada}`;
  </script>
</body>
</html>
