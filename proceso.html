<div class="container">
  <h2>Estado del Vehículo</h2>
  <p>El vehículo está en reparación</p>
  <p>Hora de entrada: <span id="horaEntrada"></span></p>
  <p>Placas: <span id="placas"></span></p>
  <p>Tipo de vehículo: <span id="tipoVehiculo"></span></p>
  <p id="cilindrajeDiv" style="display:none;">Cilindraje: <span id="cilindraje"></span> cc</p>
  <p>Marca: <span id="marca"></span></p>
  <a id="linkHistorial" href="#">Ver historial</a>
</div>

<script>
  const params = new URLSearchParams(window.location.search);

  document.getElementById("horaEntrada").textContent = params.get("horaEntrada") || "No registrada";
  document.getElementById("placas").textContent = params.get("placas") || "No registrada";
  document.getElementById("tipoVehiculo").textContent = params.get("tipoVehiculo") || "No registrado";

  if (params.get("tipoVehiculo") === "Motocicleta" && params.get("cilindraje")) {
    document.getElementById("cilindrajeDiv").style.display = "block";
    document.getElementById("cilindraje").textContent = params.get("cilindraje");
  }

  const marcaSeleccionada = params.get("marca");
  const otraMarca = params.get("otraMarca");
  if (marcaSeleccionada === "Otra" && otraMarca) {
    document.getElementById("marca").textContent = otraMarca;
  } else {
    document.getElementById("marca").textContent = marcaSeleccionada || "No registrada";
  }

  document.getElementById("linkHistorial").href =
    `historial.html?${params.toString()}`;
</script>
